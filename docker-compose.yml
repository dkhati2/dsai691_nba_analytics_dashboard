services:
  db:
    image: postgres:16
    container_name: nba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nba_three_point_revolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nba_local_pw
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/csv:/data/csv:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nba_three_point_revolution"]
      interval: 5s
      timeout: 5s
      retries: 10

  metabase:
    image: metabase/metabase:latest
    container_name: nba_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: America/Los_Angeles
    volumes:
      - mbdata:/metabase-data
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  mbdata:
